[package]
name = "claudectl"
version = "0.1.24"
edition = "2024"
rust-version = "1.89"
description = "Manage multiple Claude Code accounts"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "7"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "6"
libc = "0.2"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
urlencoding = "2"
tempfile = "3"
aes-gcm = { version = "0.10", optional = true }
axum = { version = "0.8", optional = true }
openidconnect = { version = "4", optional = true, default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, features = [
  "ring",
  "webpki-roots",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = [
  "ring",
] }
webpki-roots = { version = "1", optional = true }

[features]
# The account server binary. The client build never pulls server dependencies.
server = [
  "dep:aes-gcm",
  "dep:axum",
  "dep:openidconnect",
  "dep:deadpool-postgres",
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
  "dep:rustls",
  "dep:webpki-roots",
  "tokio/net",
  "tokio/sync",
  "tokio/signal",
]

[[bin]]
name = "claudectl"
path = "src/main.rs"

[[bin]]
name = "claudectl-server"
path = "src/bin/claudectl-server.rs"
required-features = ["server"]

[dev-dependencies]
assert_cmd = "2"
