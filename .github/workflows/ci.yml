name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Clippy (account server)
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-targets

      - name: Test (account server, file store)
        run: cargo test --all-targets --features server

      - name: Test (account server, PostgreSQL)
        env:
          CLAUDECTL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: cargo test --all-targets --features server

      - name: Build
        run: cargo build --release

      - name: Build (account server)
        run: cargo build --release --features server --bin claudectl-server

  trunk:
    name: Trunk Check
    # trunk-ignore(actionlint/runner-label): Namespace profile
    runs-on: namespace-profile-sawmills-runner-large
    steps:
      - uses: actions/checkout@v4
      - name: Cache Trunk and Rust artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # yamllint disable-line rule:line-length
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: rust
          path: |
            /home/runner/.cache/trunk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          cache: false
          check-mode: ${{ github.event_name == 'pull_request' && 'pull_request' || 'all' }}

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      # The macOS binary for on-device checks of a pull request (no local builds on the Macs).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claudectl-macos-arm64
          path: target/release/claudectl
          retention-days: 7
      - name: Test
        # Cargo may create jobserver pipes after starting; isolate each test binary.
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: python3 .github/clean-test-runner.py
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER: python3 .github/clean-test-runner.py
        run: cargo test --all-targets
