name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Clippy (account server)
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-targets

      - name: Test (account server, file store)
        run: cargo test --all-targets --features server

      - name: Test (account server, PostgreSQL)
        env:
          CLAUDECTL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: cargo test --all-targets --features server

      - name: Build
        run: cargo build --release

      - name: Build (account server)
        run: cargo build --release --features server --bin claudectl-server

  trunk:
    permissions:
      contents: read
      checks: write
    name: Trunk Check
    # trunk-ignore(actionlint/runner-label): Namespace profile
    runs-on: namespace-profile-sawmills-runner-large
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch Trunk baseline
        id: baseline
        timeout-minutes: 2
        env:
          TRUNK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          base="$TRUNK_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          fi
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "::error::Trunk Check requires a valid baseline commit."
            exit 1
          fi
          history=()
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            history=(--unshallow)
          fi
          git fetch --no-tags --no-recurse-submodules "${history[@]}" origin "$base" "$GITHUB_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Cache Trunk and Rust artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # yamllint disable-line rule:line-length
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: rust
          path: |
            /home/runner/.cache/trunk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Trunk
        timeout-minutes: 2
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1

      - name: Trunk Check
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUNK_BASE_SHA: ${{ steps.baseline.outputs.base }}
          TRUNK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if timeout --kill-after=5s 590s "$TRUNK_PATH" check --ci \
            --upstream "$TRUNK_BASE_SHA" --github-commit "$TRUNK_HEAD_SHA" \
            --github-annotate; then
            exit 0
          else
            status=$?
            if [[ "$status" == 124 || "$status" == 137 ]]; then
              echo "::error::Trunk Check exceeded its 10-minute limit; the check process was terminated."
            fi
            exit "$status"
          fi

      - name: Trunk failure diagnostics
        if: failure()
        shell: bash
        run: |
          for log in .trunk/logs/cli.log .trunk/logs/daemon.log; do
            if [[ -f "$log" ]]; then
              echo "::group::$log (last 200 lines)"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      # The macOS binary for on-device checks of a pull request (no local builds on the Macs).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claudectl-macos-arm64
          path: target/release/claudectl
          retention-days: 7
      - name: Test
        # Cargo may create jobserver pipes after starting; isolate each test binary.
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: python3 .github/clean-test-runner.py
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER: python3 .github/clean-test-runner.py
        run: cargo test --all-targets
