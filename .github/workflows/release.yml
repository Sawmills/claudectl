name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
            checkout_ref="${REF_NAME}"
            target="$(git rev-list -n 1 "${tag}")"
          else
            version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
            tag="v${version}"
            target="${GITHUB_SHA}"
            checkout_ref="${GITHUB_SHA}"

            existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
            if [[ -n "${existing}" && "${existing}" != "${target}" ]]; then
              echo "Tag ${tag} already points at ${existing}, not ${target}." >&2
              exit 1
            fi
          fi

          if [[ -z "${tag}" || "${tag}" != v* ]]; then
            echo "Expected a v* tag or package version." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: Darwin_arm64
          # trunk-ignore(actionlint/runner-label): Current GitHub Intel macOS runner label.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: Darwin_x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          archive="claudectl_${{ needs.setup.outputs.tag }}_${{ matrix.label }}.tar.gz"
          strip "target/${{ matrix.target }}/release/claudectl" || true
          tar -czf "${archive}" -C "target/${{ matrix.target }}/release" claudectl
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: claudectl_${{ matrix.label }}
          path: |
            claudectl_*.tar.gz
            claudectl_*.tar.gz.sha256

  release:
    name: Publish release
    needs: [setup, build]
    runs-on: ubuntu-latest
    outputs:
      sha_darwin_arm64: ${{ steps.shas.outputs.darwin_arm64 }}
      sha_darwin_x86_64: ${{ steps.shas.outputs.darwin_x86_64 }}
      sha_linux_x86_64: ${{ steps.shas.outputs.linux_x86_64 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - id: shas
        name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          tag="${{ needs.setup.outputs.tag }}"
          sha() { shasum -a 256 "claudectl_${tag}_$1.tar.gz" | cut -d' ' -f1; }
          {
            echo "darwin_arm64=$(sha Darwin_arm64)"
            echo "darwin_x86_64=$(sha Darwin_x86_64)"
            echo "linux_x86_64=$(sha Linux_x86_64)"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.setup.outputs.tag }}"
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/claudectl_*.tar.gz dist/claudectl_*.tar.gz.sha256 \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${tag}" dist/claudectl_*.tar.gz dist/claudectl_*.tar.gz.sha256 \
              --repo "${{ github.repository }}" --target "${{ needs.setup.outputs.target }}" \
              --title "${tag}" --generate-notes
          fi

  homebrew:
    name: Update Homebrew tap
    needs: [setup, release]
    runs-on: ubuntu-latest
    steps:
      - id: token
        name: Create token
        continue-on-error: true
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ vars.SAWMILLS_REPO_APP_ID }}
          private_key: ${{ secrets.SAWMILLS_APP_PRIVATE_KEY }}

      - name: Open formula PR on public tap
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          VERSION: ${{ needs.setup.outputs.version }}
          SHA_DARWIN_ARM64: ${{ needs.release.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X86_64: ${{ needs.release.outputs.sha_darwin_x86_64 }}
          SHA_LINUX_X86_64: ${{ needs.release.outputs.sha_linux_x86_64 }}
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/Sawmills/homebrew-tap.git" \
            "${workdir}/tap"

          cat > "${workdir}/tap/Formula/claudectl.rb" << EOF
          class Claudectl < Formula
            desc "Manage multiple Claude Code accounts"
            homepage "https://github.com/Sawmills/claudectl"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/claudectl_${TAG}_Darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${base}/claudectl_${TAG}_Darwin_x86_64.tar.gz"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              on_intel do
                url "${base}/claudectl_${TAG}_Linux_x86_64.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "claudectl"
              generate_completions_from_executable(bin/"claudectl", "completions")
            end

            test do
              help = shell_output("#{bin}/claudectl --help")
              assert_match "Usage:", help
              assert_match "claudectl", help
              assert_path_exists bash_completion/"claudectl"
              assert_path_exists zsh_completion/"_claudectl"
              assert_path_exists fish_completion/"claudectl.fish"
            end
          end
          EOF
          sed -i 's/^          //' "${workdir}/tap/Formula/claudectl.rb"

          cd "${workdir}/tap"
          if git diff --quiet -- Formula/claudectl.rb && [[ -z "$(git status --porcelain -- Formula/claudectl.rb)" ]]; then
            echo "Formula already up to date."
            exit 0
          fi

          # The public tap's main is protected (PR + required checks), so land
          # the update through a PR instead of pushing to main directly.
          branch="claudectl-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add Formula/claudectl.rb
          git commit -m "chore(claudectl): update to ${TAG}"
          git push -f origin "HEAD:${branch}"

          if ! gh pr view "${branch}" --repo Sawmills/homebrew-tap >/dev/null 2>&1; then
            gh pr create --repo Sawmills/homebrew-tap \
              --base main --head "${branch}" \
              --title "chore(claudectl): update to ${TAG}" \
              --body "Automated formula update for claudectl ${TAG}, built from https://github.com/${{ github.repository }}/releases/tag/${TAG}."
          fi

          # Best effort: queue auto-merge if the tap enables it; otherwise the
          # PR stays open for a maintainer to merge once formula-ci is green.
          gh pr merge "${branch}" --repo Sawmills/homebrew-tap --squash --auto --delete-branch \
            || echo "Auto-merge unavailable; PR left open for manual merge."
