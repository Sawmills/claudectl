# rsa 0.9.10 comes only from openidconnect (the `server` feature), which uses it to verify
# SSO ID-token signatures with the provider's public keys. The Marvin attack needs a
# private-key operation (decryption or signing) the attacker can time; claudectl performs
# none. No patched rsa release exists. Remove this entry when openidconnect drops rsa or a
# fixed rsa ships.
[[IgnoredVulns]]
id = "GHSA-4grx-2x9w-596c"
ignoreUntil = 2027-01-09
reason = "rsa via openidconnect verifies public-key signatures only; no private-key operation; no fixed release"
