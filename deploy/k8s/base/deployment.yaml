apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: claudectl
  name: claudectl
  annotations:
    checkov.io/skip1: CKV_K8S_43=Release must replace template workload images with the published digest before Argo registration.
    checkov.io/skip2: CKV_K8S_35=Database credentials come from the ExternalSecret by design.
spec:
  # Every replica serves; a per-account database lease keeps one refresh owner.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: claudectl
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claudectl
        app.kubernetes.io/component: server
    spec:
      # Drain: readiness fails, in-flight refreshes and verifications finish, then exit.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: claudectl
              app.kubernetes.io/component: server
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: claudectl
                  app.kubernetes.io/component: server
      initContainers:
        - name: prepare-secrets
          imagePullPolicy: Always
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -ec
            - >-
              cp /projected/vault-key /keys/vault-key;
              cp /projected/oidc-client-secret /keys/oidc-client-secret;
              cp /projected/metrics-token /keys/metrics-token;
              chmod 600 /keys/vault-key /keys/oidc-client-secret /keys/metrics-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - { name: projected, mountPath: /projected, readOnly: true }
            - { name: keys, mountPath: /keys }
      containers:
        - name: server
          imagePullPolicy: Always
          image: claudectl-server:staging
          args:
            - serve
            - --key-file
            - /keys/vault-key
            - --listen
            - 0.0.0.0:8787
            - --public-url
            - https://claudectl.ue1.staging.plat.sm-svc.com
            - --metrics-token-file
            - /keys/metrics-token
            - --sso-config
            - /configuration/sso.json
            # Amir's own accounts only (SAW-12454). Add nobody else.
            - --allow-user
            - amir@sawmills.ai
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: claudectl-postgres, key: DATABASE_URL }
            - name: CLAUDECTL_SERVER_DB_CA_FILE
              value: /etc/claudectl/rds-ca/global-bundle.pem
            - name: HOSTNAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          ports:
            - { name: http, containerPort: 8787 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          volumeMounts:
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: configuration, mountPath: /configuration, readOnly: true }
            - { name: rds-ca, mountPath: /etc/claudectl/rds-ca, readOnly: true }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: projected
          secret:
            secretName: claudectl-secrets
            defaultMode: 288
        - name: keys
          emptyDir: { medium: Memory }
        - name: configuration
          configMap:
            name: claudectl-sso
        - name: rds-ca
          configMap:
            name: claudectl-rds-ca
        - name: temporary
          emptyDir: {}
