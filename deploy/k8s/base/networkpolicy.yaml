apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: claudectl
  name: claudectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claudectl
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Internal ALB target connections use private VPC addresses.
        - ipBlock: { cidr: 10.1.0.0/16 }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: http }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        # Anthropic (console.anthropic.com, api.anthropic.com) and the company issuer use HTTPS.
        - { protocol: TCP, port: 443 }
