apiVersion: v1
kind: Service
metadata:
  namespace: claudectl
  name: claudectl
  labels:
    app.kubernetes.io/name: claudectl
spec:
  selector:
    app.kubernetes.io/name: claudectl
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# One DNS record per ready pod, so Prometheus scrapes every replica's own counters.
apiVersion: v1
kind: Service
metadata:
  namespace: claudectl
  name: claudectl-pods
  labels:
    app.kubernetes.io/name: claudectl
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: claudectl
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8787
      targetPort: http
