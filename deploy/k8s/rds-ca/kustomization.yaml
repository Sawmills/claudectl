apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # The AWS RDS global CA bundle, copied from codexctl deploy/k8s/rds-ca.
  - name: claudectl-rds-ca
    files:
      - global-bundle.pem
  # The same bundle for the PreSync migration Job: Argo CD creates hooks before the
  # Sync-phase resources, so the Job cannot mount the regular ConfigMap on a first sync.
  - name: claudectl-rds-ca-migration
    files:
      - global-bundle.pem
    options:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-1"
generatorOptions:
  disableNameSuffixHash: true
