apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: claudectl-rds-ca
    files:
      # The AWS RDS global CA bundle, copied from codexctl deploy/k8s/rds-ca.
      - global-bundle.pem
generatorOptions:
  # The migration Job mounts this stable name.
  disableNameSuffixHash: true
