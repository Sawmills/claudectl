apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: claudectl
  name: claudectl-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: claudectl-secrets
    creationPolicy: Owner
    # Losing the vault key loses every sealed grant. Keep the secret if this object goes.
    deletionPolicy: Retain
  data:
    # trunk-ignore(checkov/CKV_SECRET_6): Secret name and SSM path only. No secret value.
    - secretKey: vault-key
      remoteRef:
        key: /app/claudectl/vault-key
        decodingStrategy: Base64
    # The Google OAuth client secret is an SSM SecureString, as for codexctl; staging has
    # no Secrets Manager store.
    # trunk-ignore(checkov/CKV_SECRET_6): Secret name and SSM path only. No secret value.
    - secretKey: oidc-client-secret
      remoteRef:
        key: /app/claudectl/oidc-client-secret
    # trunk-ignore(checkov/CKV_SECRET_6): Secret name and SSM path only. No secret value.
    - secretKey: metrics-token
      remoteRef:
        key: /app/claudectl/metrics-token
