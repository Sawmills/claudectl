apiVersion: v1
kind: ConfigMap
metadata:
  namespace: claudectl
  name: claudectl-sso
data:
  # client_id: the Clerk OAuth application for this server (deploy item 4 in
  # docs/superpowers/plans/2026-10-06-saw-12454-claude-server.md). Replace before registration.
  sso.json: |
    {
      "issuer": "https://clerk.sawmills.ai",
      "client_id": "REPLACE_WITH_CLAUDECTL_CLERK_CLIENT_ID",
      "client_secret_file": "/keys/oidc-client-secret",
      "allowed_domains": ["sawmills.ai"]
    }
