apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claudectl
resources:
  - ../../rds-ca
  - ../../base
  - ingress.yaml
  - externalsecret.yaml
  - sso.yaml
  - monitoring.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: claudectl
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLAUDECTL_CENTRAL_BROWSER_RESETS
          value: "1"
images:
  # The Server image manifest for main e2cb009d (#155, run 45256193947).
  - name: claudectl-server
    newName: 767398060436.dkr.ecr.us-east-1.amazonaws.com/claudectl-server
    digest: sha256:0ea49c74ba88b16e50f59c79c251a50ca9675d47f2345d744f5da8450d260732
