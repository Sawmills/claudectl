apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claudectl
resources:
  - ../../rds-ca
  - ../../base
  - ingress.yaml
  - externalsecret.yaml
  - sso.yaml
  - monitoring.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: claudectl
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLAUDECTL_CENTRAL_BROWSER_RESETS
          value: "1"
images:
  # The Server image manifest for main ca9d429c (#103, run 39046069953).
  - name: claudectl-server
    newName: 767398060436.dkr.ecr.us-east-1.amazonaws.com/claudectl-server
    digest: sha256:3d91f8a3e9642f969e128e9b96bdfefb250aab4f36dded39876fdffc07436ae3
