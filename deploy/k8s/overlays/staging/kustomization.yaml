apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claudectl
resources:
  - ../../rds-ca
  - ../../base
  - ingress.yaml
  - externalsecret.yaml
  - sso.yaml
  - monitoring.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: claudectl
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLAUDECTL_CENTRAL_BROWSER_RESETS
          value: "1"
images:
  # The Server image manifest for main a96df1f6 (#96, run 39001190001).
  - name: claudectl-server
    newName: 767398060436.dkr.ecr.us-east-1.amazonaws.com/claudectl-server
    digest: sha256:cc3e0cbd1896c7253aaf5b31134e413078486427af17993fbef85978a21a297b
