apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claudectl
resources:
  - ../../rds-ca
  - ../../base
  - ingress.yaml
  - externalsecret.yaml
  - sso.yaml
  - monitoring.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: claudectl
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLAUDECTL_CENTRAL_BROWSER_RESETS
          value: "1"
images:
  # The Server image manifest for main a63d00df (#128, run 42508276151).
  - name: claudectl-server
    newName: 767398060436.dkr.ecr.us-east-1.amazonaws.com/claudectl-server
    digest: sha256:6e7d585c18c5efa61630ad568f5461aa5d887750c6cc258edfb0f4ab4122d3fb
