apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claudectl
resources:
  - ../../rds-ca
  - ../../base
  - ingress.yaml
  - externalsecret.yaml
  - sso.yaml
  - monitoring.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: claudectl
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLAUDECTL_CENTRAL_BROWSER_RESETS
          value: "1"
images:
  # The Server image manifest for main 80163da8 (#99, run 39015147917).
  - name: claudectl-server
    newName: 767398060436.dkr.ecr.us-east-1.amazonaws.com/claudectl-server
    digest: sha256:a046977ff73149455168445efb659b542709dd1ac1ad27eec6841273b1eb6e67
